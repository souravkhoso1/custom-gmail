<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css" integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column vh-100 overflow-hidden">

<!-- Header -->
<nav class="navbar navbar-light bg-white border-bottom shadow-sm flex-shrink-0 px-3" style="height:56px">
  <div class="d-flex align-items-center gap-2">
    <!-- Mobile: hamburger to toggle sidebar -->
    <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebar-toggle" aria-label="Toggle sidebar">
      <i class="fas fa-bars"></i>
    </button>
    <a class="navbar-brand fw-semibold d-flex align-items-center gap-2 mb-0" href="">
      <i class="fas fa-envelope-open-text text-primary"></i>
      <span class="d-none d-sm-inline">My Custom Gmail</span>
    </a>
  </div>
  <!-- Search -->
  <form class="d-none d-md-flex flex-grow-1 mx-3" id="search-form" onsubmit="return false;">
    <div class="input-group input-group-sm">
      <input type="search" id="search-input" class="form-control rounded-pill-start bg-light border-end-0" placeholder="Search mail…" aria-label="Search">
      <button class="btn btn-light border border-start-0 rounded-pill-end" type="submit" onclick="searchMessages()">
        <i class="fas fa-search text-muted"></i>
      </button>
    </div>
  </form>
  <div class="d-flex gap-2">
    <button class="btn btn-primary btn-sm rounded-pill px-3" id="compose-btn" style="display:none" data-bs-toggle="modal" data-bs-target="#compose-modal">
      <i class="fas fa-pen me-1"></i> Compose
    </button>
    <a href="#" id="authorize_button" class="btn btn-primary btn-sm rounded-pill px-3" style="display:none">Authorize</a>
    <a href="#" id="signout_button" class="btn btn-outline-secondary btn-sm rounded-pill px-3" style="display:none">Sign Out</a>
  </div>
</nav>

<!-- Main -->
<div class="d-flex flex-grow-1 overflow-hidden position-relative">

  <!-- Sidebar -->
  <div class="sidebar border-end bg-light d-flex flex-column py-3" id="sidebar">
    <p class="text-uppercase text-muted fw-semibold px-3 mb-2" style="font-size:11px;letter-spacing:.8px">Mailboxes</p>
    <hr class="my-0 mb-1">
    <div class="list-group list-group-flush px-2">
      <a class="list-group-item list-group-item-action border-0 rounded-2 d-flex align-items-center gap-2 py-2 fw-medium"
         data-label="INBOX" onclick="fetchMessages('INBOX')">
        <i class="fas fa-inbox text-muted fa-fw"></i> Inbox
        <span class="badge bg-primary rounded-pill ms-auto" id="badge-inbox"></span>
      </a>
      <a class="list-group-item list-group-item-action border-0 rounded-2 d-flex align-items-center gap-2 py-2 fw-medium"
         data-label="SENT" onclick="fetchMessages('SENT')">
        <i class="fas fa-paper-plane text-muted fa-fw"></i> Sent
      </a>
      <a class="list-group-item list-group-item-action border-0 rounded-2 d-flex align-items-center gap-2 py-2 fw-medium"
         data-label="TRASH" onclick="fetchMessages('TRASH')">
        <i class="fas fa-trash-alt text-muted fa-fw"></i> Trash
      </a>
      <a class="list-group-item list-group-item-action border-0 rounded-2 d-flex align-items-center gap-2 py-2 fw-medium"
         data-label="SPAM" onclick="fetchMessages('SPAM')">
        <i class="fas fa-exclamation-circle text-muted fa-fw"></i> Spam
      </a>
    </div>
  </div>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay d-none" id="sidebar-overlay"></div>

  <!-- Message list -->
  <div class="msg-list-panel border-end bg-white overflow-y-auto" id="messages-div"></div>

  <!-- Message reading pane -->
  <div class="flex-grow-1 bg-white overflow-y-auto p-4 p-md-5" id="message-div"></div>
</div>

<!-- Footer -->
<footer class="border-top bg-white text-center text-muted py-2 flex-shrink-0" style="font-size:12px">
  <i class="far fa-copyright"></i> 2026
  <a href="https://github.com/souravkhoso1/" target="_blank" class="text-primary text-decoration-none">Sourav Khoso</a>
</footer>

<!-- Compose Modal -->
<div class="modal fade" id="compose-modal" tabindex="-1" aria-labelledby="compose-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="compose-modal-label">New Message</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <input type="email" id="compose-to" class="form-control form-control-sm" placeholder="To">
        </div>
        <div class="mb-2">
          <input type="email" id="compose-cc" class="form-control form-control-sm" placeholder="CC">
        </div>
        <div class="mb-2">
          <input type="email" id="compose-bcc" class="form-control form-control-sm" placeholder="BCC">
        </div>
        <div class="mb-2">
          <input type="text" id="compose-subject" class="form-control form-control-sm" placeholder="Subject">
        </div>
        <div>
          <textarea id="compose-body" class="form-control" rows="8" placeholder="Message"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Discard</button>
        <button type="button" id="compose-send-btn" class="btn btn-primary btn-sm" onclick="sendEmail()">
          <i class="fas fa-paper-plane me-1"></i> Send
        </button>
      </div>
    </div>
  </div>
</div>

<!-- jQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="js/script.js"></script>
<!-- Google Identity Services (auth) -->
<script src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
<!-- Gmail API client -->
<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
</body>
</html>
