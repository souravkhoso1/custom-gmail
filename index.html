<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css" integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column vh-100 overflow-hidden">

<!-- Header -->
<nav class="navbar navbar-light bg-white border-bottom shadow-sm flex-shrink-0 px-4" style="height:56px">
  <a class="navbar-brand fw-semibold d-flex align-items-center gap-2 mb-0" href="">
    <i class="fas fa-envelope-open-text text-primary"></i> My Custom Gmail
  </a>
  <div class="d-flex gap-2">
    <a href="#" id="authorize_button" class="btn btn-primary btn-sm rounded-pill px-3" style="display:none">Authorize</a>
    <a href="#" id="signout_button" class="btn btn-outline-secondary btn-sm rounded-pill px-3" style="display:none">Sign Out</a>
  </div>
</nav>

<!-- Main -->
<div class="d-flex flex-grow-1 overflow-hidden">

  <!-- Sidebar -->
  <div class="sidebar border-end bg-light d-flex flex-column py-3">
    <p class="text-uppercase text-muted fw-semibold px-3 mb-2" style="font-size:11px;letter-spacing:.8px">Mailboxes</p>
    <hr class="my-0 mb-1">
    <div class="list-group list-group-flush px-2">
      <a class="list-group-item list-group-item-action border-0 rounded-2 d-flex align-items-center gap-2 py-2 fw-medium"
         onclick="fetchMessages('INBOX')">
        <i class="fas fa-inbox text-muted fa-fw"></i> Inbox
        <span class="badge bg-primary rounded-pill ms-auto" id="badge-inbox"></span>
      </a>
      <a class="list-group-item list-group-item-action border-0 rounded-2 d-flex align-items-center gap-2 py-2 fw-medium"
         onclick="fetchMessages('SENT')">
        <i class="fas fa-paper-plane text-muted fa-fw"></i> Sent
        <span class="badge bg-primary rounded-pill ms-auto" id="badge-sent"></span>
      </a>
      <a class="list-group-item list-group-item-action border-0 rounded-2 d-flex align-items-center gap-2 py-2 fw-medium"
         onclick="fetchMessages('TRASH')">
        <i class="fas fa-trash-alt text-muted fa-fw"></i> Trash
        <span class="badge bg-primary rounded-pill ms-auto" id="badge-trash"></span>
      </a>
      <a class="list-group-item list-group-item-action border-0 rounded-2 d-flex align-items-center gap-2 py-2 fw-medium"
         onclick="fetchMessages('SPAM')">
        <i class="fas fa-exclamation-circle text-muted fa-fw"></i> Spam
        <span class="badge bg-primary rounded-pill ms-auto" id="badge-spam"></span>
      </a>
    </div>
  </div>

  <!-- Message list -->
  <div class="msg-list-panel border-end bg-white overflow-y-auto" id="messages-div"></div>

  <!-- Message reading pane -->
  <div class="flex-grow-1 bg-white overflow-y-auto p-5" id="message-div"></div>
</div>

<!-- Footer -->
<footer class="border-top bg-white text-center text-muted py-2 flex-shrink-0" style="font-size:12px">
  <i class="far fa-copyright"></i> 2026
  <a href="https://github.com/souravkhoso1/" target="_blank" class="text-primary text-decoration-none">Sourav Khoso</a>
</footer>

<!-- jQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="js/script.js"></script>
<!-- Google Identity Services (auth) -->
<script src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
<!-- Gmail API client -->
<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
</body>
</html>
